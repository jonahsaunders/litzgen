name: Release

# Push a tag such as v1.0.1 (matching __version__ in litzgen/__init__.py) to publish.
# The workflow tests, builds dist/litzgen-pcm.zip and attaches it to a GitHub release,
# which is what the README's "Download" link (releases/latest/download/litzgen-pcm.zip) serves.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Check tag matches package version
        run: |
          VER=$(python -c "import litzgen; print(litzgen.__version__)")
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match litzgen.__version__ ($VER)"; exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build package and example board
        run: |
          python build_pcm.py | tee build.txt
          python -m litzgen generate -o dist/paper_coil.kicad_pcb
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install in KiCad: **Plugin and Content Manager → Install from File…** → \`litzgen-pcm.zip\`."
            echo
            echo '```'
            cat build.txt
            echo '```'
          } > notes.md
          FILES=(dist/litzgen-pcm.zip "dist/litzgen-pcm-$VER.zip" dist/paper_coil.kicad_pcb)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Release already exists (e.g. created from the GitHub Releases page): attach the files.
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "LitzGen $VER" --notes-file notes.md --generate-notes
          fi
