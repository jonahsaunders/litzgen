[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litzgen"
dynamic = ["version"]
description = "Generator and solver for transposed multi-bundle PCB Litz coils (KiCad plugin + CLI)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonah Saunders" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["kicad", "pcb", "litz", "coil", "wireless power", "inductor", "peec"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
fast = ["scipy"]

[project.urls]
Homepage = "https://github.com/jonahbsaunders/litzgen"
Releases = "https://github.com/jonahbsaunders/litzgen/releases"

[project.scripts]
litzgen = "litzgen.cli:main"

[tool.setuptools.dynamic]
version = { attr = "litzgen.__version__" }

[tool.setuptools.packages.find]
include = ["litzgen*"]

[tool.setuptools.package-data]
litzgen = ["icon.png"]
